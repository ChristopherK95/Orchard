[package]
name = "editor-core"
description = "The Rust core of the agent-first editor: owns Agent sessions, the ACP adapter and all state (ADR 0003)."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Watches .git/worktrees so Worktrees made in a terminal show up live.
notify = "8"
similar = "2"
thiserror.workspace = true
tokio.workspace = true
# The settings file (ticket 08).
toml = "1"
# The memory monitor's process and memory readings (ticket 12).
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

# Stopping a setup command together with everything it started (ticket 09): a Job object on
# Windows, a process group on Linux.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Scripted ACP agent used by the core's tests in place of `claude-agent-acp`.
[[bin]]
name = "fake-acp-agent"
path = "src/bin/fake_acp_agent.rs"
