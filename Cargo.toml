[workspace]
resolver = "2"
members = ["crates/editor-core", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
