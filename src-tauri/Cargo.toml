[package]
name = "agent-editor"
description = "Tauri shell for the agent-first editor: forwards IPC to editor-core and nothing else."
edition.workspace = true
version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
editor-core = { path = "../crates/editor-core" }
serde.workspace = true
tauri = { version = "2", features = [] }
# Native notifications with click handling (the Tauri plugin can't report clicks on desktop).
notify-rust = "4.18"
# Links in the chat open in the system browser instead of navigating the app.
tauri-plugin-opener = "2"
