[package]
name = "orchard"
description = "Tauri shell for the agent-first editor: forwards IPC to editor-core and nothing else."
edition.workspace = true
version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json.workspace = true

[dependencies]
editor-core = { path = "../crates/editor-core" }
serde.workspace = true
tokio.workspace = true
tauri = { version = "2", features = [] }
# Native notifications with click handling (the Tauri plugin can't report clicks on desktop).
notify-rust = "4.18"
# Links in the chat open in the system browser instead of navigating the app.
tauri-plugin-opener = "2"
# The Workspace picker's Browse… (the native folder dialog).
tauri-plugin-dialog = "2"

# Pasting an image into the composer: WebKitGTK doesn't hand the page an image copied from another
# app, so it's read off the GTK clipboard.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
