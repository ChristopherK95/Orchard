# Save as .github/workflows/claude-mention.yml
# Trigger: comment "@claude ..." on a PR (conversation, inline review comment,
# or review summary). Claude pushes fixes to the same PR branch.
name: Claude mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only respond to you (the repo owner), and only when @claude is mentioned
    if: |
      (github.event_name == 'issue_comment' &&
        github.event.comment.author_association == 'OWNER' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.author_association == 'OWNER' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.author_association == 'OWNER' &&
        contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(pnpm:*),Bash(npx:*),Bash(cargo:*)"
